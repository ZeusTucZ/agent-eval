[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalkit"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2", "google-genai>=1.20", "openai>=1.40", "fastapi>=0.115", "uvicorn[standard]>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]  # httpx backs fastapi.testclient in test/test_api.py

[tool.setuptools]
packages = ["evalkit"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]
