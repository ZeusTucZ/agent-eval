[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalkit"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2", "google-genai>=1.20", "openai>=1.40"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["evalkit"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]
