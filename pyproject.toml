[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# "agenteval" is taken on PyPI, so the distribution follows the "py" + import name convention
# (as pyyaml installs `yaml`): pip install pyagenteval, then `import agenteval` and run
# `agenteval`. 1.0.0 was published as zeustucz-agenteval.
name = "pyagenteval"
version = "1.1.0"
description = "Run your LLM agent many times, trace every step, and find out why it fails: correctness, tool use, latency, cost, retries and regressions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lorenzo" }]
requires-python = ">=3.11"
keywords = ["llm", "agents", "evaluation", "rag", "testing", "observability"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
# The core: run, trace, score, report, compare, judge. openai is here because every
# OpenAI-compatible provider (OpenAI, Groq, Ollama, OpenRouter, vLLM...) goes through it.
dependencies = ["pydantic>=2", "openai>=1.40"]

[project.optional-dependencies]
gemini = ["google-genai>=1.20"]
# The HTTP API and the dashboard (agenteval ui, or a deployed server).
server = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
# The rag dataset's search tool. Large (ChromaDB pulls in onnxruntime), so only on request.
rag = ["chromadb>=1.5"]
all = ["pyagenteval[gemini,server,rag]"]
dev = [
    "pyagenteval[all]",
    "pytest>=8",
    "httpx>=0.27",  # backs fastapi.testclient in test/test_api.py
    "ruff>=0.6",
    "mypy>=1.11",
    "build>=1",
]

[project.scripts]
agenteval = "agenteval.cli:main"

[project.urls]
Homepage = "https://github.com/ZeusTucZ/agent-eval"
Documentation = "https://zeustucz.github.io/agent-eval/"
Issues = "https://github.com/ZeusTucZ/agent-eval/issues"
Changelog = "https://github.com/ZeusTucZ/agent-eval/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["agenteval*"]

[tool.setuptools.package-data]
# The built-in datasets, and the dashboard once built into agenteval/static (see the release workflow).
"*" = ["*.jsonl", "py.typed", "*.html", "*.js", "*.css", "*.woff", "*.woff2", "*.svg", "*.ico"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]

[tool.ruff]
line-length = 120
target-version = "py311"  # also flags syntax newer than the oldest Python supported
extend-exclude = ["dashboard"]

[tool.ruff.lint]
# Real errors only: syntax, undefined names, unused imports and bugbear's likely bugs.
# Style rules (import order and the like) are left off so linting doesn't rewrite every file.
select = ["E4", "E7", "E9", "F", "B"]

[tool.mypy]
# The package's own code; optional SDKs it doesn't have stubs for count as Any.
files = ["agenteval"]
python_version = "3.11"
ignore_missing_imports = true
warn_redundant_casts = true
