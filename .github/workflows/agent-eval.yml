name: agent-eval

# The regression gate: runs the agent on this change, compares it with the stored baseline
# from main, and fails if quality dropped. agent-eval-baseline.yml keeps the baseline up to date.
#
# A run uses about 140,000 tokens and Groq's free tier allows 200,000 a day, so only one
# run fits in a day: four PRs checked at once used up the quota and none could be judged.
# So it runs only on PRs labelled "run-agent-eval" (add the label when the PR is ready),
# and only when files that can change the agent's answers changed.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "agenteval/**"
      # Not part of the agent the gate runs: the HTTP API, the LLM judge, calibration,
      # re-scoring and the rag dataset's search tool.
      - "!agenteval/api.py"
      - "!agenteval/config.py"
      - "!agenteval/judge.py"
      - "!agenteval/calibrate.py"
      - "!agenteval/rescore.py"
      - "!agenteval/rag.py"
      - "prompts/**"
      - "agenteval/data/hard.jsonl"
      - ".github/workflows/agent-eval.yml"
  workflow_dispatch:

# A newer push to the same branch replaces a check that's still running.
concurrency:
  group: agent-eval-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read  # to find and download the stored baseline
  contents: read
  pull-requests: write

# Must match agent-eval-baseline.yml, or the two runs won't be comparable.
env:
  DATASET: hard
  ATTEMPTS: 3  # odd, so a case can't tie; catches far more than 2 attempts (see the README)
  RPM: 16

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Only on PRs labelled run-agent-eval, and only from this repository: secrets aren't
    # available to pull requests from forks. Adding some other label changes nothing, so
    # it doesn't start the check again.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'run-agent-eval') &&
       (github.event.action != 'labeled' || github.event.label.name == 'run-agent-eval'))
    steps:
      - name: Check for the API key
        id: key
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::notice::Skipping the agent eval: add a GROQ_API_KEY repository secret to enable it."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.skip != 'true'

      - uses: actions/setup-python@v5
        if: steps.key.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.key.outputs.skip != 'true'
        run: pip install -e .

      - name: Download the baseline
        id: baseline
        if: steps.key.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --workflow agent-eval-baseline.yml --branch main --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty' || true)
          if [ -n "$run_id" ] && gh run download "$run_id" --name agent-eval-baseline --dir .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No stored baseline yet: run the agent-eval-baseline workflow on main."
          fi

      # Without a baseline there's nothing to compare, so don't spend quota; the gate reports it.
      # A crash isn't fatal here either: the gate sees the missing results and says "can't judge".
      - name: Run this change
        if: steps.baseline.outputs.found == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -m agenteval.run --agent groq --dataset "$DATASET" --attempts "$ATTEMPTS" \
            --rpm "$RPM" --timeout 900 --name candidate --db candidate.db \
            || echo "::warning::The run failed."

      - name: Decide
        id: gate
        if: steps.key.outputs.skip != 'true'
        run: |
          set +e
          python -m agenteval.gate baseline.db candidate.db --markdown report.md
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      # Everything needed to see why a check came out as it did, including full error messages.
      - uses: actions/upload-artifact@v4
        if: always() && steps.key.outputs.skip != 'true'
        with:
          name: agent-eval-results
          path: |
            report.md
            baseline.db
            candidate.db
          if-no-files-found: ignore
          retention-days: 14

      # Model output in the report is escaped by agenteval.gate, because it's untrusted text.
      - name: Comment on the pull request
        if: steps.key.outputs.skip != 'true' && github.event_name == 'pull_request' && steps.gate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- agent-eval-gate -->'
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq "map(select(.body | startswith(\"$marker\"))) | .[0].id // empty" | head -1)
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -F body=@report.md > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@report.md > /dev/null
          fi

      - name: Pass or fail
        if: steps.key.outputs.skip != 'true'
        env:
          CODE: ${{ steps.gate.outputs.code }}
        run: |
          case "$CODE" in
            0) echo "Passed." ;;
            1) echo "::error::Blocked: see the report in this run's summary or the PR comment."; exit 1 ;;
            *) echo "::error::Can't judge this change: re-run it, or review it by hand."; exit 1 ;;
          esac
