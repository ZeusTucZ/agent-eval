name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # dev includes every extra (gemini, server, rag), so no test is skipped for a missing one.
      - name: Install
        run: pip install -e ".[dev]" langchain-core

      - name: Run tests
        run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff>=0.6"

      # The rules are in pyproject.toml: real errors, and syntax newer than Python 3.11.
      - name: Lint
        run: ruff check --output-format github .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # With the optional SDKs installed, so calls into them are checked too.
      - name: Install
        run: pip install -e ".[all]" "mypy>=1.11"

      - name: Type check
        run: mypy

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        run: npm ci

      # tsc type-checks the whole app before vite builds it, so a type error fails here
      # instead of in a deploy.
      - name: Type-check and build
        run: npm run build

  package:
    # Builds the wheel the way a release does (dashboard included) and installs it in a clean
    # environment, so a file missing from the package fails here, not for users.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build the dashboard into the package
        run: |
          cd dashboard && npm ci && npm run build && cd ..
          rm -rf agenteval/static && cp -r dashboard/dist agenteval/static

      - name: Build
        run: pip install build && python -m build

      - name: Install the wheel and smoke-test it outside the repository
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install "$(ls dist/*.whl)[server]"
          cd /tmp
          /tmp/clean/bin/agenteval --version
          /tmp/clean/bin/agenteval run --cases 10 --attempts 1 --quiet --db smoke.db
          /tmp/clean/bin/agenteval report --db smoke.db --format json > report.json
          /tmp/clean/bin/python -c "import agenteval, pathlib; p = pathlib.Path(agenteval.__file__).parent; assert (p / 'data' / 'hard.jsonl').is_file() and (p / 'static' / 'index.html').is_file()"
          /tmp/clean/bin/python -c "from agenteval.sample_data import hard_cases; assert len(hard_cases()) == 55"
