name: Feature request
description: Something agenteval should measure or do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to find out about your agent?
      description: The question you can't answer today, rather than the feature you have in mind.
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: What would help?
