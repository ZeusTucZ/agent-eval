# Render Blueprint: New > Blueprint, pick this repo, and Render creates the
# Web Service from this file instead of clicks in the dashboard.
# Secrets are declared with `sync: false`: Render asks for their values in
# its panel and never reads them from the repo. Do NOT put a real key here.
services:
  - type: web
    name: agent-eval-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    # Free tier: no persistent disk, so the SQLite file (agenteval.db, the default
    # DATABASE_PATH) is lost on every redeploy or restart. To keep data, move to
    # a paid plan, add a `disk` mounted at /data and set DATABASE_PATH to a file
    # under it.
    plan: free
    # For a public demo that nobody can change, also set READ_ONLY=1.
    envVars:
      # The disk is ephemeral, so start each deploy with example experiments to look at.
      - key: DEMO_SEED
        value: "1"
      - key: API_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
